saveExact: true
storeDir: .pnpm-store

packages:
  - agents/*
  - mcp/*
  - packages/*
  - skills/*

versioning:
  changelog:
    storage: repository

catalog:
  "@types/node": 26.5.1
  fast-check: 4.10.0
  tsdown: 0.23.0
  typescript: 7.0.2
  zod: 4.6.4

# Seven days; keep aligned with Dependabot's npm cooldown.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@zemd/*"
trustPolicy: no-downgrade

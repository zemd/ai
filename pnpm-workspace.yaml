saveExact: true
storeDir: .pnpm-store

packages:
  - agents/*
  - mcp/*
  - packages/*
  - skills/*

versioning:
  changelog:
    storage: repository

catalog:
  "@types/node": 26.4.0
  fast-check: 4.9.0
  tsdown: 0.22.14
  typescript: 7.0.2
  zod: 4.5.4

# Seven days; keep aligned with Dependabot's npm cooldown.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@zemd/*"
trustPolicy: no-downgrade
